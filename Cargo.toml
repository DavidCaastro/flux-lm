[package]
name = "flux-lm"
version = "0.1.0"
edition = "2021"
description = "Flux v3 byte-level language model — float generics + O(L) backward"

[[bin]]
name = "flux-lm"
path = "src/main.rs"

[features]
default = []
f32 = []
corpus-stream = ["ureq", "flate2"]

[dependencies]
ureq = { version = "2", optional = true }
flate2 = { version = "1", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
